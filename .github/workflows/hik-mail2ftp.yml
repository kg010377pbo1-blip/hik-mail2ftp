name: Hikvision mail -> FTP

on:
  schedule:
    # 4 раза в день: 06:00, 12:00, 18:00, 00:00 по Киеву летом (UTC+3);
    # зимой (UTC+2) — на час раньше. GitHub может запускать с опозданием.
    - cron: "0 3,9,15,21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Только показать, ничего не загружать"
        type: boolean
        default: false

# Не запускать два прохода одновременно
concurrency:
  group: hik-mail2ftp
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        # torch только для CPU: в разы меньше обычного пакета
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Mail -> FTP
        env:
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          TZ: Europe/Kyiv
        run: |
          python hik_mail2ftp.py ${{ inputs.dry_run && '--dry-run' || '' }}
