name: Hikvision mail -> FTP

on:
  schedule:
    # Обработка — каждый час (чтобы снимки не копились). Отчёт на почту — только
    # в часы из config.ini [report] hours (08:00 и 20:00 по Киеву).
    # GitHub может запускать с опозданием.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Только показать, ничего не загружать"
        type: boolean
        default: false
      ipcam_since:
        description: "Разово почистить папки IPCAM с даты (ГГГГ-ММ-ДД), пусто — как обычно"
        type: string
        default: ""

# Не запускать два прохода одновременно
concurrency:
  group: hik-mail2ftp
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        # torch только для CPU: в разы меньше обычного пакета
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Mail -> FTP
        env:
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          IPCAM_SINCE: ${{ inputs.ipcam_since }}
          TZ: Europe/Kyiv
        run: |
          python hik_mail2ftp.py ${{ inputs.dry_run && '--dry-run' || '' }}
