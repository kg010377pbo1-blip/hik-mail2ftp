; Несекретные настройки. Логины/пароли/хосты НЕ пишите сюда —
; они берутся из переменных окружения (в GitHub — из Secrets):
;   IMAP_USER, IMAP_PASSWORD, FTP_HOST, FTP_USER, FTP_PASSWORD
; Любой параметр ниже тоже можно переопределить переменной SECTION_KEY, напр. FTP_ROOT.

[imap]
host = imap.gmail.com
port = 993
folder = INBOX
; Адрес отправителя регистратора (пусто = не фильтровать)
from_filter =
; Часть темы. Тема у регистратора: "NVR-DS-7604NI-K1: Motion Detected On Channel D2"
subject_filter = NVR-DS-7604NI-K1
; Метка Gmail для обработанных писем (пусто = только пометить прочитанным)
processed_label = hik-processed
; true = после загрузки фото на FTP письмо уходит в Корзину Gmail
; (Gmail сам очищает Корзину через 30 дней). Письма без фото не удаляются.
delete_after_upload = true

[ftp]
port = 21
; true = FTPS (explicit TLS)
tls = false
passive = true
root = /hikvision
; Сколько FTP-соединений открывать одновременно (ускоряет загрузку).
; Если хостинг ограничивает число соединений — уменьшите.
connections = 4
; {camera}=Camera_02(D2) {channel}=D2 {event}=Motion_Detected {device}=NVR-DS-7604NI-K1
; {date} {time} {year} {month} {day} {filename}
path_template = {camera}/{date}/{time}_{filename}

[main]
interval_seconds = 60
max_messages_per_run = 1000
; Сколько писем забирать за раз; фото из пачки заливаются параллельно
batch_size = 20
; пусто = лог только в консоль (для GitHub Actions)
log_file =

[analyze]
; Детектор YOLO: люди, машины, собаки, кошки на каждом фото
enabled = true
; yolo11n.pt — быстрее, yolo11s.pt — точнее на мелких объектах
model = yolo11s.pt
; Минимальная уверенность детектора (0..1)
confidence = 0.4
; Объект пропал дольше чем на N минут — следующее появление считается новым визитом
visit_gap_minutes = 5
; Журнал кадров с объектами (CSV по дням) на FTP
journal_dir = /hikvision/reports

[ipcam]
; Папки камер на FTP: <папка-камера>/.../<фото> (подпапки до 3 уровней).
; Фото читаются и анализируются.
dirs = IPCAM_HOME1, IPCAM_HOME2, IPCAM_HOME3, IPCAM_HOME4, IPCAM_HOME5, IPCAM_HOME6, IPCAM_HOME7, IPCAM_HOME8
; В этих папках снимки без людей/машин/собак/кошек переносятся в карантин
; <папка>_empty (та же структура), а через quarantine_days дней после съёмки удаляются.
cleanup_dirs = IPCAM_HOME1, IPCAM_HOME2, IPCAM_HOME3, IPCAM_HOME4, IPCAM_HOME5, IPCAM_HOME6, IPCAM_HOME7, IPCAM_HOME8
quarantine_suffix = _empty
quarantine_days = 3
; При самом первом запуске взять фото за последние N часов (дальше — только новые)
first_run_lookback_hours = 24
; Не больше стольких фото за прогон (остальные — в следующий раз)
max_files_per_run = 20000

[report]
; Отчёт на почту в эти часы (по Киеву): всё, что найдено с прошлого отчёта.
; Пусто — отчёт после каждого прогона.
hours = 8, 20
; Получатель — секрет REPORT_TO; отправка через тот же Gmail (IMAP_USER/IMAP_PASSWORD).
enabled = true
claude_model = claude-opus-5-5
; Сколько ключевых кадров показать Claude и приложить к письму
max_images = 6
; true = слать письмо, даже если никого не нашли
send_empty = false
; Свои животные: Claude называет их по именам, если узнаёт на кадре.
; Каждое — с новой строки, строки начинаются с отступа.
pets =
    Рей — чёрный пёс (мальчик)
    Джоя — белая собака с рыжими пятнами (девочка)
    Боня — большой рыжий пёс (мальчик)
    Мышка — серая собака (девочка)
    Милка — рыжая собака, меньше Бони (девочка)
